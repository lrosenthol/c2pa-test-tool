description: MP4 with valid C2PA manifest
inputs:
  assetPath: ./mp4_valid.mp4
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $required_success_codes:
    - claimSignature.validated
    - signingCredential.trusted
expressions:
  _isEmpty: "length(@[0]) = 0"
  _containsAllOf: "length(@[0][?contains($required_success_codes, code)]) = length($required_success_codes)"
manifests:
- formula: >-
    _isEmpty(failure) &&
    _containsAllOf(success, $required_success_codes)
