description: PNG with valid C2PA manifest
inputs:
  assetPath: ./png_valid.png
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $required_success_codes:
    - claimSignature.validated
    - signingCredential.trusted
expressions:
  _isEmpty: "length(@[0]) = 0"
  _containsAllOf: "length(@[0][?contains(@[1], code)]) = length(@[1])"
manifests:
- formula: >-
    _isEmpty(failure) &&
    _containsAllOf(success, $required_success_codes)
