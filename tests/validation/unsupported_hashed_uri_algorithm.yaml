description: hashed URI algorithm unsupported (algorithm.unsupported)
inputs:
  assetPath: ./unsupported_hashed_uri_algorithm.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $expected_failure_codes:
    - algorithm.unsupported
expressions:
  _hasUnsupportedAlgorithmFailure: "length(@[0][?contains($expected_failure_codes, code)]) = length($expected_failure_codes)"
manifests:
- formula: _hasUnsupportedAlgorithmFailure(failure)
