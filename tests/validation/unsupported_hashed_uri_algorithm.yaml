  assetPath: ./unsupported_hashed_uri_algorithm.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $expected_failure_codes:
    - algorithm.unsupported
expressions:
  _containsAllOf: "length(@[0][?contains(@[1], code)]) = length(@[1])"
manifests:
- formula: _containsAllOf(failure, $expected_failure_codes)
