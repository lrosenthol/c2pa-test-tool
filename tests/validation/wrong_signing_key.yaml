description: claim signature created with a different key than the one in the cert
inputs:
  assetPath: ./wrong_signing_key.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $expected_failure_codes:
    - claimSignature.mismatch
  $excluded_success_codes:
    - claimSignature.validated
expressions:
  _containsAllOf: "length(@[0][?contains(@[1], code)]) = length(@[1])"
  _containsNoneOf: "length(@[0][?contains(@[1], code)]) = 0"
manifests:
- formula: >-
    _containsAllOf(failure, $expected_failure_codes) &&
    _containsNoneOf(success, $excluded_success_codes)
