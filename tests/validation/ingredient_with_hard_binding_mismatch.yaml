description: JPEG with C2PA manifest, carrying a c2pa.opened action that references
  an ingredient with a data hash failure
inputs:
  assetPath: ./ingredient_with_hard_binding_mismatch.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
globals:
  $active_success_codes:
    - signingCredential.trusted
    - claimSignature.insideValidity
    - claimSignature.validated
  $ingredient_expected_failure_codes:
    - assertion.dataHash.mismatch
  $ingredient_excluded_success_codes:
    - assertion.dataHash.match
expressions:
  _isEmpty: "length(@[0]) = 0"
  _containsAllOf: "length(@[0][?contains(@[1], code)]) = length(@[1])"
  _containsNoneOf: "length(@[0][?contains(@[1], code)]) = 0"
manifests:
- formula: >-
    _isEmpty(failure) &&
    _containsAllOf(success, $active_success_codes)
- formula: >-
    _containsAllOf(failure, $ingredient_expected_failure_codes) &&
    _containsNoneOf(success, $ingredient_excluded_success_codes)
